<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خط الزمن الأردني — أداة الحفظ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFE3C8;
    --paper-deep:#E4D5AF;
    --ink:#1B2A41;
    --ink-soft:#2E3F58;
    --gold:#A8791C;
    --gold-bright:#C99A2E;
    --clay:#8E4436;
    --teal:#215F67;
    --brown-text:#4A3C2A;
    --card-bg:#FBF6E9;
    --line:#C9B689;
    --shadow: 0 6px 18px rgba(27,42,65,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(168,121,28,0.06) 0, transparent 45%),
      radial-gradient(circle at 85% 75%, rgba(33,95,103,0.06) 0, transparent 45%);
    color:var(--brown-text);
    font-family:'Tajawal', sans-serif;
    direction:rtl;
    min-height:100vh;
  }
  h1,h2,h3,.display{font-family:'Amiri', serif;}

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    background:linear-gradient(180deg, var(--ink) 0%, var(--ink-soft) 100%);
    color:var(--paper);
    padding:56px 20px 34px;
    overflow:hidden;
    text-align:center;
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(45deg, rgba(200,154,46,0.06) 0 2px, transparent 2px 26px),
      repeating-linear-gradient(-45deg, rgba(200,154,46,0.06) 0 2px, transparent 2px 26px);
    opacity:.7;
    pointer-events:none;
  }
  .hero-content{position:relative; z-index:1; max-width:820px; margin:0 auto;}
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-size:.8rem; letter-spacing:.12em; color:var(--gold-bright);
    border:1px solid rgba(201,154,46,.4); border-radius:999px;
    padding:5px 16px; margin-bottom:18px;
  }
  .hero h1{font-size:clamp(2.1rem, 5vw, 3.1rem); margin:0 0 10px; font-weight:700;}
  .hero p.sub{font-size:1.05rem; color:#D9CBAE; margin:0 0 30px; line-height:1.9;}

  .mini-timeline{
    display:flex; gap:0; overflow-x:auto; padding:6px 4px 14px;
    scrollbar-width:thin;
  }
  .mini-timeline::-webkit-scrollbar{height:6px;}
  .mini-timeline::-webkit-scrollbar-thumb{background:var(--gold); border-radius:4px;}
  .mini-stop{
    flex:0 0 auto; display:flex; flex-direction:column; align-items:center;
    padding:0 18px; position:relative; cursor:pointer; min-width:96px;
  }
  .mini-stop:not(:last-child)::after{
    content:""; position:absolute; top:9px; right:-50%; width:100%; height:2px;
    background:linear-gradient(90deg, rgba(201,154,46,.55), rgba(201,154,46,.15));
  }
  .mini-dot{
    width:18px; height:18px; border-radius:50%;
    background:var(--ink); border:2px solid var(--gold-bright);
    margin-bottom:8px; position:relative; z-index:1;
    transition:transform .15s ease, background .15s ease;
  }
  .mini-stop:hover .mini-dot{transform:scale(1.25); background:var(--gold-bright);}
  .mini-label{font-size:.72rem; color:#C8B98F; white-space:nowrap;}

  /* ---------- NAV BAR ---------- */
  .toolbar{
    position:sticky; top:0; z-index:20;
    background:rgba(239,227,200,0.94);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
    padding:12px 20px;
    display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;
  }
  .tabs{display:flex; gap:8px; flex-wrap:wrap;}
  .tab-btn{
    font-family:'Tajawal'; font-weight:700; font-size:.85rem;
    border:1px solid var(--line); background:var(--card-bg);
    color:var(--ink); padding:8px 16px; border-radius:999px; cursor:pointer;
    transition:.15s;
  }
  .tab-btn:hover{border-color:var(--gold);}
  .tab-btn.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .search-wrap{position:relative; flex:1; min-width:180px; max-width:280px;}
  .search-wrap input{
    width:100%; padding:9px 14px; border-radius:999px; border:1px solid var(--line);
    background:var(--card-bg); font-family:'Tajawal'; font-size:.85rem; color:var(--ink);
  }
  .search-wrap input:focus{outline:2px solid var(--gold-bright); outline-offset:1px;}

  .mode-switch{display:flex; border:1px solid var(--ink); border-radius:999px; overflow:hidden;}
  .mode-switch button{
    font-family:'Tajawal'; font-weight:700; font-size:.85rem; padding:9px 18px;
    border:none; background:transparent; color:var(--ink); cursor:pointer;
  }
  .mode-switch button.active{background:var(--ink); color:var(--paper);}

  /* ---------- MAIN ---------- */
  main{max-width:980px; margin:0 auto; padding:28px 20px 80px;}
  .era-section{margin-bottom:40px;}
  .era-title{
    display:flex; align-items:center; gap:12px;
    font-size:1.4rem; color:var(--ink); margin:0 0 16px;
    border-bottom:2px solid var(--gold-bright); padding-bottom:8px;
  }
  .era-num{
    display:flex; align-items:center; justify-content:center;
    width:32px; height:32px; border-radius:50%;
    background:var(--clay); color:var(--paper); font-size:.85rem; font-weight:700;
    flex:0 0 auto; font-family:'Tajawal';
  }

  .cards{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:14px;}
  .card{
    background:var(--card-bg); border:1px solid var(--line); border-radius:14px;
    padding:16px 18px; box-shadow:var(--shadow); position:relative;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:hover{transform:translateY(-3px); box-shadow:0 10px 24px rgba(27,42,65,.16);}
  .card .num{
    position:absolute; top:14px; left:14px;
    font-family:'Amiri'; font-weight:700; color:var(--line); font-size:1.1rem;
  }
  .card h3{margin:0 0 10px; font-size:1.05rem; color:var(--ink); padding-left:26px; line-height:1.5;}
  .dates{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:8px;}
  .pill{
    font-size:.78rem; font-weight:700; padding:3px 10px; border-radius:8px;
  }
  .pill.hijri{background:rgba(168,121,28,0.15); color:var(--gold);}
  .pill.greg{background:rgba(33,95,103,0.15); color:var(--teal);}
  .concurrent{font-size:.8rem; color:var(--brown-text); opacity:.8; margin-top:6px; line-height:1.6;}
  .concurrent b{color:var(--clay);}

  .empty-state{
    text-align:center; padding:50px 20px; color:var(--brown-text); opacity:.7;
    font-family:'Amiri'; font-size:1.1rem;
  }

  /* ---------- MEMORIZE MODE ---------- */
  .memo-wrap{max-width:640px; margin:0 auto; padding:20px;}
  .progress-bar{
    background:var(--paper-deep); border-radius:999px; height:10px; overflow:hidden;
    margin-bottom:8px; border:1px solid var(--line);
  }
  .progress-fill{
    height:100%; background:linear-gradient(90deg, var(--gold), var(--clay));
    width:0%; transition:width .3s ease;
  }
  .progress-label{font-size:.82rem; color:var(--brown-text); text-align:center; margin-bottom:22px;}

  .memo-actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
  .memo-actions button{
    font-family:'Tajawal'; font-weight:700; font-size:.9rem; padding:12px 22px;
    border-radius:12px; border:none; cursor:pointer; transition:.15s;
  }
  .btn-remember{background:var(--teal); color:#fff;}
  .btn-remember:hover{background:#1a4d54;}
  .btn-review{background:var(--clay); color:#fff;}
  .btn-review:hover{background:#733730;}
  .btn-ghost{background:transparent; border:1px solid var(--ink); color:var(--ink);}
  .btn-ghost:hover{background:var(--ink); color:var(--paper);}

  .memo-controls{display:flex; gap:10px; justify-content:center; margin-bottom:26px; flex-wrap:wrap;}
  select{
    font-family:'Tajawal'; padding:8px 14px; border-radius:10px; border:1px solid var(--line);
    background:var(--card-bg); color:var(--ink); font-size:.85rem;
  }

  .done-state{text-align:center; padding:40px 10px;}
  .done-state h2{color:var(--ink); font-size:1.6rem;}
  .done-state p{color:var(--brown-text); margin-bottom:22px;}

  .quiz-setup{text-align:center;}
  .quiz-progress{text-align:center; font-size:.85rem; opacity:.7; margin-bottom:10px;}
  .quiz-card{
    background:var(--card-bg); border:1px solid var(--line); border-radius:16px;
    padding:26px; box-shadow:var(--shadow); text-align:center;
  }
  .options-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
  .opt-btn{
    font-family:'Amiri'; font-size:1.15rem; padding:14px 10px; border-radius:12px;
    border:2px solid var(--line); background:var(--paper); color:var(--ink); cursor:pointer;
    transition:.15s;
  }
  .opt-btn:hover:not(:disabled){border-color:var(--gold-bright);}
  .opt-btn.correct{background:var(--teal); border-color:var(--teal); color:#fff;}
  .opt-btn.wrong{background:var(--clay); border-color:var(--clay); color:#fff;}
  .opt-btn:disabled{cursor:default;}
  .quiz-feedback{margin-top:16px; font-weight:700; min-height:20px;}
  .quiz-feedback.ok{color:var(--teal);}
  .quiz-feedback.bad{color:var(--clay);}
  @media (max-width:480px){ .options-grid{grid-template-columns:1fr;} }

  .reward-box{
    margin-top:22px; padding:18px; border-radius:14px;
    background:linear-gradient(135deg, rgba(201,154,46,.15), rgba(33,95,103,.12));
    border:1px solid var(--gold-bright);
  }
  .reward-title{font-weight:700; color:var(--ink); margin:0 0 12px;}
  .rider-illustration{max-width:260px; margin:0 auto 14px;}
  .rider-illustration svg{width:100%; height:auto; display:block; animation: gallop 1.1s ease-in-out infinite;}
  @keyframes gallop{
    0%,100%{ transform: translateY(0) rotate(0deg); }
    50%{ transform: translateY(-7px) rotate(-2deg); }
  }
  .video-fallback-link{
    display:inline-block; margin-top:10px; font-size:.8rem; color:var(--teal);
    text-decoration:underline; font-weight:700;
  }

  .review-list{display:flex; flex-direction:column; gap:10px; max-width:520px; margin:0 auto;}
  .review-item{
    display:flex; gap:12px; align-items:flex-start; padding:12px 14px;
    border-radius:12px; border:1px solid var(--line); background:var(--card-bg);
  }
  .review-item.ok{border-inline-start:4px solid var(--teal);}
  .review-item.bad{border-inline-start:4px solid var(--clay);}
  .review-num{
    flex:0 0 auto; width:24px; height:24px; border-radius:50%;
    background:var(--ink); color:var(--paper); font-size:.75rem;
    display:flex; align-items:center; justify-content:center; font-weight:700;
  }
  .review-event{font-weight:700; color:var(--ink); margin-bottom:4px;}
  .review-line{font-size:.85rem; opacity:.85;}
  .review-cal{opacity:.6; font-size:.78rem;}

  .report-block{max-width:520px; margin:0 auto 26px;}
  .report-title{font-size:1rem; color:var(--ink); margin-bottom:12px; border-bottom:1px solid var(--line); padding-bottom:6px;}
  .trend-bars{display:flex; flex-direction:column; gap:8px;}
  .trend-row{display:flex; align-items:center; gap:10px; font-size:.78rem;}
  .trend-date{flex:0 0 54px; opacity:.7;}
  .trend-track{flex:1; background:var(--paper-deep); border-radius:999px; height:10px; overflow:hidden; border:1px solid var(--line);}
  .trend-fill{height:100%; background:linear-gradient(90deg, var(--gold), var(--clay));}
  .trend-pct{flex:0 0 38px; text-align:left; font-weight:700; color:var(--ink);}
  .weak-list{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:8px;}
  .weak-list li{
    display:flex; justify-content:space-between; gap:10px; font-size:.85rem;
    background:var(--card-bg); border:1px solid var(--line); border-radius:10px; padding:9px 14px;
  }
  .weak-rate{color:var(--clay); font-weight:700; white-space:nowrap;}
  .reward-video{
    position:relative; width:100%; max-width:280px; margin:0 auto;
    aspect-ratio:9/16; border-radius:12px; overflow:hidden; box-shadow:var(--shadow);
  }
  .reward-video iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}

  footer{
    text-align:center; padding:22px; font-size:.78rem; color:var(--brown-text); opacity:.6;
    border-top:1px solid var(--line);
  }

  .burger-btn{ display:none; }
  .toolbar-controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap; flex:1; justify-content:flex-end; }
  @media (max-width:768px){
    .toolbar{flex-direction:column; align-items:stretch;}
    .toolbar-controls{ width:100%; justify-content:space-between; order:1; }
    .burger-btn{
      display:flex;
      background:var(--card-bg); border:1px solid var(--line); border-radius:999px;
      color:var(--ink); cursor:pointer; padding:8px 14px;
      align-items:center; justify-content:center; gap:6px;
      font-family:'Tajawal'; font-weight:700; font-size:.85rem;
    }
    .burger-btn:hover{ border-color:var(--gold); }
    .search-wrap{ order:3; width:100%; flex:1 1 100%; margin-top:4px; max-width:none; }
    .tabs{
      display:none; 
      flex-direction:column; 
      width:100%;
      margin-top:10px;
      order:2;
    }
    .tabs.open{ display:flex; }
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important;}
  }
  :focus-visible{outline:3px solid var(--gold-bright); outline-offset:2px;}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-content">
    <span class="eyebrow">من صدر الإسلام إلى الثورة العربية الكبرى</span>
    <h1>خط الزمن الأردني</h1>
    <p class="sub">١٤ قرنًا من تاريخ الأردن — من صلح الحديبية إلى وعد بلفور — في موقع واحد يساعدك على الحفظ والمراجعة.</p>
    <div class="mini-timeline" id="miniTimeline"></div>
  </div>
</div>

<div class="toolbar">
  <div class="tabs" id="eraTabs"></div>
  <div class="toolbar-controls">
    <button id="burgerBtn" class="burger-btn">
      الفترات
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
    <div class="search-wrap" id="searchWrap">
      <input type="text" id="searchInput" placeholder="ابحث عن حدث…">
    </div>
    <div class="mode-switch">
      <button id="browseBtn" class="active">تصفح</button>
      <button id="memoBtn">اختبار</button>
    </div>
  </div>
</div>

<main>
  <div id="browseView"></div>

  <div id="memoView" style="display:none;">
    <div class="memo-wrap">
      <div id="quizHost"></div>
    </div>
  </div>
</main>

<footer>أداة حفظ خاصة بك — تقدّمك يُحفظ تلقائيًا في هذا المتصفح.</footer>

/* ---------------- QUIZ MODE ---------------- */
const HISTORY_KEY = "quiz-history-v1";
const STATS_KEY = "quiz-item-stats-v1";
let quizHistory = [];
let itemStats = {}; // { [itemId]: {attempts, misses} }
let quizPool = [];
let quizQuestions = [];
let quizAnswers = [];
let quizIndex = 0;
let quizScore = 0;
let quizEra = "الكل";
let quizCount = "all";
let quizAnswered = false;

async function loadHistory(){
  try{
    const val = localStorage.getItem(HISTORY_KEY);
    if(val){ quizHistory = JSON.parse(val); }
  }catch(e){ /* لا يوجد سجل سابق بعد */ }
  try{
    const val2 = localStorage.getItem(STATS_KEY);
    if(val2){ itemStats = JSON.parse(val2); }
  }catch(e){ /* لا توجد إحصائيات بعد */ }
}
async function saveHistoryEntry(entry){
  quizHistory.push(entry);
  try{
    localStorage.setItem(HISTORY_KEY, JSON.stringify(quizHistory));
  }catch(e){ console.error("تعذر حفظ النتيجة:", e); }
}
async function saveStats(){
  try{
    localStorage.setItem(STATS_KEY, JSON.stringify(itemStats));
  }catch(e){ console.error("تعذر حفظ الإحصائيات:", e); }
}
function recordAnswerStat(itemId, isCorrect){
  const s = itemStats[itemId] || {attempts:0, misses:0};
  s.attempts++;
  if(!isCorrect) s.misses++;
  itemStats[itemId] = s;
}

function hasDigits(str){
  return typeof str === "string" && /\d/.test(str);
}

function possibleTypesFor(item){
  const types = [];
  if(hasDigits(item.greg)) types.push("greg");
  if(item.hijri !== "—" && hasDigits(item.hijri)) types.push("hijri");
  return types;
}

function buildQuestionPool(era){
  let pool = era==="الكل" ? DATA : DATA.filter(d=>d.era===era);
  return pool.filter(d=> possibleTypesFor(d).length>0);
}

function overallAverage(){
  if(!quizHistory.length) return 0;
  const totalPct = quizHistory.reduce((s,h)=> s + (h.score/h.total*100), 0);
  return Math.round(totalPct/quizHistory.length);
}

function renderQuizSetup(){
  const host = document.getElementById("quizHost");
  const eligible = buildQuestionPool(quizEra).length;
  const countOptions = [5,10,15,20,30].filter(n=>n<eligible);
  host.innerHTML = `

      ${quizHistory.length? `
        <p style="margin-top:26px; font-size:.85rem; opacity:.75;">معدلك في كل محاولاتك السابقة (${quizHistory.length}): <b>${overallAverage()}%</b></p>
        <button class="btn-ghost" id="viewReportBtn" style="margin-top:10px; padding:8px 18px; font-size:.82rem;">تقرير تقدّمي بالحفظ 📊</button>
      ` : ""}

  const sel = document.getElementById("quizEraSelect");
  sel.innerHTML = ["الكل", ...ERAS].map(e=>`<option value="${e}">${e}</option>`).join("");
  sel.value = quizEra;
  sel.addEventListener("change", ()=>{ quizEra = sel.value; renderQuizSetup(); });
  const countSel = document.getElementById("quizCountSelect");
  if(!countOptions.includes(Number(quizCount)) && quizCount!=="all") quizCount = "all";
  countSel.value = quizCount;
  countSel.addEventListener("change", ()=>{ quizCount = countSel.value; });
  document.getElementById("startQuizBtn").addEventListener("click", startQuiz);
  const reportBtn = document.getElementById("viewReportBtn");
  if(reportBtn) reportBtn.addEventListener("click", renderReportScreen);

function fakeValueLike(correctStr){
  // Builds a plausible-looking distractor that mimics the shape of correctStr (single year or range)
  const nums = correctStr.match(/\d+/g).map(Number);
  const shift = () => {
    const delta = (Math.floor(Math.random()*25)+5) * (Math.random()>0.5?1:-1);
    return Math.max(1, nums[0]+delta);
  };
  if(nums.length===1){
    return String(shift());
  }else{
    const span = nums[1]-nums[0];
    const start = shift();
    return `${start}-${start+Math.max(span,1)}`;
  }
}

function startQuiz(){
  quizPool = buildQuestionPool(quizEra);
  for(let i=quizPool.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [quizPool[i],quizPool[j]] = [quizPool[j],quizPool[i]];
  }
  if(quizCount!=="all"){
    quizPool = quizPool.slice(0, Number(quizCount));
  }
  quizQuestions = quizPool.map(item=>{
    const types = possibleTypesFor(item);
    const type = types[Math.floor(Math.random()*types.length)];
    const correct = type==="hijri" ? item.hijri : item.greg;

    // distractor candidates: same field AND same kind (event date vs. person lifespan), from the whole dataset
    let candidates = DATA
      .filter(d=> d.n!==item.n && possibleTypesFor(d).includes(type) && !!d.isPerson === !!item.isPerson)
      .map(d=> type==="hijri" ? d.hijri : d.greg);
    candidates = [...new Set(candidates)].filter(v=>v!==correct);
    for(let i=candidates.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [candidates[i],candidates[j]] = [candidates[j],candidates[i]];
    }
    const distractors = candidates.slice(0,3);
    while(distractors.length<3){
      const fake = fakeValueLike(correct);
      if(fake!==correct && !distractors.includes(fake)) distractors.push(fake);
    }
    const options = [correct, ...distractors];
    for(let i=options.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [options[i],options[j]] = [options[j],options[i]];
    }
    return {item, type, correct, options};
  });
  quizIndex = 0;
  quizScore = 0;
  quizAnswers = [];
  quizAnswered = false;
  renderQuizQuestion();
}

function renderQuizQuestion(){
  const host = document.getElementById("quizHost");
  if(quizIndex >= quizQuestions.length){
    renderQuizResults();
    return;
  }
  const q = quizQuestions[quizIndex];
  const calendarLabel = q.type==="hijri" ? "هجري" : "ميلادي";
  const questionText = q.item.isPerson
    ? `في أي فترة (${calendarLabel}) عاش «${q.item.event}»؟`
    : `في أي عام (${calendarLabel}) وقع: «${q.item.event}»؟`;
  host.innerHTML = `
    <div class="quiz-progress">سؤال ${quizIndex+1} من ${quizQuestions.length}</div>
    <div class="quiz-card">
      <span class="tag" style="opacity:.6; font-size:.78rem;">${q.item.era}</span>
      <h3 class="qtext" style="margin:10px 0 22px;">${questionText}</h3>
      <div class="options-grid">
        ${q.options.map(opt=>`<button class="opt-btn" data-year="${opt}">${opt}</button>`).join("")}
      </div>
      <div id="quizFeedback" class="quiz-feedback"></div>
      <div class="memo-actions" style="margin-top:16px;">
        <button class="btn-ghost" id="nextQBtn" style="display:none;">السؤال التالي</button>
      </div>
    </div>`;

  host.querySelectorAll(".opt-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(quizAnswered) return;
      quizAnswered = true;
      const chosen = btn.dataset.year;
      const isCorrect = chosen === q.correct;
      if(isCorrect) quizScore++;
      recordAnswerStat(q.item.n, isCorrect);
      quizAnswers.push({
        event:q.item.event, era:q.item.era, calendar:calendarLabel,
        chosen, correct:q.correct, isCorrect
      });
      host.querySelectorAll(".opt-btn").forEach(b=>{
        b.disabled = true;
        if(b.dataset.year === q.correct) b.classList.add("correct");
        else if(b===btn) b.classList.add("wrong");
      });
      document.getElementById("quizFeedback").textContent = isCorrect ? "إجابة صحيحة! ✓" : `للأسف، الإجابة الصحيحة هي ${q.correct}`;
      document.getElementById("quizFeedback").className = "quiz-feedback " + (isCorrect?"ok":"bad");
      document.getElementById("nextQBtn").style.display = "inline-block";
    });
  });
  document.getElementById("nextQBtn").addEventListener("click", ()=>{
    quizIndex++;
    quizAnswered = false;
    renderQuizQuestion();
  });
}

async function renderQuizResults(){
  const total = quizQuestions.length;
  const pct = total ? Math.round((quizScore/total)*100) : 0;
  await saveHistoryEntry({score:quizScore, total, date:new Date().toISOString()});
  await saveStats();
  const host = document.getElementById("quizHost");
  const REWARD_THRESHOLD = 80;
  const earnedReward = pct >= REWARD_THRESHOLD;
  host.innerHTML = `
    <div class="done-state">
      <h2>النتيجة النهائية</h2>
      <p style="font-size:1.4rem; color:var(--ink); font-family:'Amiri';">حصلت على ${quizScore} من ${total}</p>

      <p style="opacity:.75; font-size:.85rem;">المعدل العام لكل محاولاتك (${quizHistory.length}): ${overallAverage()}%</p>
      ${earnedReward ? `

        </div>` : `
        <p style="font-size:.85rem; opacity:.7; max-width:360px; margin:14px auto 0;">حقق ${REWARD_THRESHOLD}% أو أكثر عشان توصلك هدية خاصة 🎁</p>`}
      <div class="memo-actions" style="margin-top:20px;">
        <button class="btn-ghost" id="reviewBtn">راجع إجاباتك</button>
        <button class="btn-remember" id="retryBtn">أعد الاختبار</button>
        <button class="btn-ghost" id="backSetupBtn">تغيير العصر</button>
      </div>
    </div>`;
  document.getElementById("reviewBtn").addEventListener("click", renderQuizReview);
  document.getElementById("retryBtn").addEventListener("click", startQuiz);
  document.getElementById("backSetupBtn").addEventListener("click", renderQuizSetup);
}

function renderQuizReview(){

}

function renderReportScreen(){
  const host = document.getElementById("quizHost");
  const attempts = quizHistory.slice(-10);
  const maxBar = 100;
  const weakItems = Object.entries(itemStats)
    .map(([id, s])=>({id:Number(id), ...s, rate: s.attempts? s.misses/s.attempts : 0}))
    .filter(s=>s.attempts>=1 && s.misses>0)
    .sort((a,b)=> b.rate-a.rate || b.misses-a.misses)
    .slice(0,5)
    .map(s=>({...s, item: DATA.find(d=>d.n===s.id)}));

  host.innerHTML = `
    <h2 class="display" style="color:var(--ink); text-align:center; margin-bottom:6px;">تقرير التقدم بالحفظ</h2>
    <p style="text-align:center; opacity:.75; font-size:.85rem; margin-bottom:20px;">بناءً على ${quizHistory.length} محاولة اختبار محفوظة على هذا الجهاز</p>

    <div class="report-block">
      <h3 class="report-title">آخر المحاولات</h3>
      <div class="trend-bars">
        ${attempts.map(h=>{
          const p = Math.round((h.score/h.total)*100);
          const d = new Date(h.date);
          const label = d.toLocaleDateString('ar', {day:'numeric', month:'short'});
          return `<div class="trend-row">
            <span class="trend-date">${label}</span>
            <div class="trend-track"><div class="trend-fill" style="width:${p}%"></div></div>
            <span class="trend-pct">${p}%</span>
          </div>`;
        }).join("")}
      </div>
    </div>

    <div class="report-block">
      <h3 class="report-title">الأحداث اللي تحتاج تراجعها أكثر</h3>
      ${weakItems.length ? `
        <ul class="weak-list">
          ${weakItems.map(w=>`<li><span>${w.item ? w.item.event : 'حدث محذوف'}</span><span class="weak-rate">${w.misses} من ${w.attempts} غلط</span></li>`).join("")}
        </ul>` : `<p style="opacity:.7; font-size:.85rem;">ما في أخطاء متكررة لسا — استمري! 🎉</p>`}
    </div>

    <div class="memo-actions" style="margin-top:20px;">
      <button class="btn-remember" id="backFromReportBtn">رجوع</button>
    </div>`;
  document.getElementById("backFromReportBtn").addEventListener("click", renderQuizSetup);
}
